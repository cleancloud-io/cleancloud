[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleancloud"
version = "1.14.1"
description = "Read-only cloud hygiene for AWS, Azure, and GCP. Multi-account org scanning, CI/CD enforcement, and deterministic cost modeling. No agents, no telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CleanCloud", email = "suresh@getcleancloud.com"}
]
keywords = ["aws", "azure", "gcp", "cloud", "hygiene", "devops", "sre", "infrastructure", "security", "compliance", "enterprise", "ci-cd", "read-only"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]

aws = [
    "boto3>=1.34.0",
]
azure = [
    "azure-identity>=1.19.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-subscription>=3.0.0",
    "azure-mgmt-managementgroups>=1.0.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-network>=25.0.0",
    "azure-mgmt-web>=8.0.0",
    "azure-mgmt-sql>=3.0.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-mgmt-containerregistry>=10.0.0",
    "azure-mgmt-machinelearningservices>=1.0.0",
    "azure-core>=1.38.0",
]
gcp = [
    "google-auth>=2.20.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-monitoring>=2.19.0",
    "google-cloud-resource-manager>=1.12.0",
    "requests>=2.28.0",
]
all = [
    "cleancloud[aws]",
    "cleancloud[azure]",
    "cleancloud[gcp]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/cleancloud-io/cleancloud"
Documentation = "https://github.com/cleancloud-io/cleancloud#readme"
Repository = "https://github.com/cleancloud-io/cleancloud"
Issues = "https://github.com/cleancloud-io/cleancloud/issues"
Discussions = "https://github.com/cleancloud-io/cleancloud/discussions"
"Source Code" = "https://github.com/cleancloud-io/cleancloud"
Changelog = "https://github.com/cleancloud-io/cleancloud/releases"

[project.scripts]
cleancloud = "cleancloud.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cleancloud*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=cleancloud --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
